<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <title>Studio — Selected Work</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html { background: #08090a; scroll-behavior: smooth; }
    body { margin: 0; color: #f4f2ed; background: #08090a; }
    .sequence { height: 1200vh; position: relative; }
    .stage { position: sticky; top: 0; height: 100svh; min-height: 480px; overflow: hidden; isolation: isolate; background: #08090a; }
    #sequence-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #loader { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #08090a; color: #f4f2ed; font-size: 11px; letter-spacing: .18em; transition: opacity .45s ease, visibility .45s ease; }
    #loader.hidden { opacity: 0; visibility: hidden; }
    @media (max-width: 600px) { .sequence { height: 900vh; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">LOADING 0%</div>
  <main>
    <section class="sequence" id="sequence" aria-label="Scroll through the project">
      <div class="stage">
        <canvas id="sequence-canvas" aria-label="Animated project visual"></canvas>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const FRAME_COUNT = 990;
      const FRAME_FOLDER = "std2";
      const CACHE_BEHIND = 8;
      const MAX_CACHE_AHEAD = 18;
      const MIN_CACHE_AHEAD = 3;
      const MAX_CONCURRENT_LOADS = 4;
      const MAX_FALLBACK_DISTANCE = 8;
      const canvas = document.getElementById("sequence-canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const section = document.getElementById("sequence");
      const loader = document.getElementById("loader");
      const frames = new Array(FRAME_COUNT);
      const loadingFrames = new Set();
      let wantedFrames = new Set();
      let targetFrame = 0;
      let scrollDirection = 1;
      let lastFrameCenter = 0;
      let lastFrameCenterTime = performance.now();
      let scrollFrameSpeed = 0;
      let dpr = 1;
      let animationRequested = false;

      // Frames use the existing std2/ab (1).jpg through std2/ab (990).jpg files.
      function pumpFrameLoads() {
        for (const index of wantedFrames) {
          if (loadingFrames.size >= MAX_CONCURRENT_LOADS) break;
          if (frames[index] || loadingFrames.has(index)) continue;

          const image = new Image();
          frames[index] = image;
          loadingFrames.add(index);
          image.decoding = "async";
          image.fetchPriority = index === Math.round(targetFrame) ? "high" : "low";
          image.onload = () => {
            loadingFrames.delete(index);
            if (!wantedFrames.has(index)) frames[index] = null;
            requestDraw();
            pumpFrameLoads();
          };
          image.onerror = () => {
            loadingFrames.delete(index);
            frames[index] = null;
            console.error("Failed to load animation frame:", image.src);
            pumpFrameLoads();
          };
          image.src = `${FRAME_FOLDER}/ab%20(${index + 1}).jpg`;
        }
      }

      function draw(framePosition) {
        const frameIndex = Math.round(framePosition);
        let image = frames[frameIndex];
        if (!image?.complete || !image.naturalWidth) image = null;

        if (!image) {
          for (let distance = 1; distance <= MAX_FALLBACK_DISTANCE; distance++) {
            const candidates = scrollDirection > 0
              ? [frameIndex + distance, frameIndex - distance]
              : [frameIndex - distance, frameIndex + distance];
            for (const candidateIndex of candidates) {
              if (candidateIndex < 0 || candidateIndex >= FRAME_COUNT) continue;
              const candidate = frames[candidateIndex];
              if (candidate?.complete && candidate.naturalWidth) {
                image = candidate;
                break;
              }
            }
            if (image) break;
          }
        }

        if (!image) return false;
        const width = canvas.width;
        const height = canvas.height;
        const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
        const drawWidth = image.naturalWidth * scale;
        const drawHeight = image.naturalHeight * scale;
        ctx.fillStyle = "#08090a";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(image, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
        loader.classList.add("hidden");
        return true;
      }

      function requestDraw() {
        if (animationRequested) return;
        animationRequested = true;
        requestAnimationFrame(() => {
          animationRequested = false;
          draw(targetFrame);
        });
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.round(canvas.clientWidth * dpr);
        canvas.height = Math.round(canvas.clientHeight * dpr);
        requestDraw();
      }

      function requestFrameWindow(center, ahead) {
        const nextWantedFrames = new Set([center]);
        const currentFrame = frames[center];
        if (currentFrame && loadingFrames.has(center)) currentFrame.fetchPriority = "high";
        for (let offset = 1; offset <= ahead; offset++) {
          const index = center + scrollDirection * offset;
          if (index >= 0 && index < FRAME_COUNT) nextWantedFrames.add(index);
        }
        for (let offset = 1; offset <= CACHE_BEHIND; offset++) {
          const index = center - scrollDirection * offset;
          if (index >= 0 && index < FRAME_COUNT) nextWantedFrames.add(index);
        }

        for (const index of wantedFrames) {
          if (!nextWantedFrames.has(index) && !loadingFrames.has(index)) frames[index] = null;
        }
        wantedFrames = nextWantedFrames;
        pumpFrameLoads();
      }

      function updateScroll() {
        const rect = section.getBoundingClientRect();
        const distance = section.offsetHeight - window.innerHeight;
        const progress = distance > 0 ? Math.min(1, Math.max(0, -rect.top / distance)) : 0;
        targetFrame = progress * (FRAME_COUNT - 1);
        const center = Math.round(targetFrame);
        if (center !== lastFrameCenter) {
          const now = performance.now();
          const elapsed = Math.max(now - lastFrameCenterTime, 16);
          const measuredSpeed = Math.abs(center - lastFrameCenter) * 1000 / elapsed;
          scrollFrameSpeed = Math.min(1000, scrollFrameSpeed * 0.5 + measuredSpeed * 0.5);
          scrollDirection = center > lastFrameCenter ? 1 : -1;
          lastFrameCenter = center;
          lastFrameCenterTime = now;
        }
        const ahead = Math.min(
          MAX_CACHE_AHEAD,
          Math.max(MIN_CACHE_AHEAD, Math.ceil(scrollFrameSpeed * 0.06))
        );
        requestFrameWindow(center, ahead);
        requestDraw();
      }
      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("scroll", updateScroll, { passive: true });
      resize();
      updateScroll();
    })();
  </script>
</body>
</html>
